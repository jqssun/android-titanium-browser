name: Build Patched Titanium

on:
  push:
    branches:
      - fix/immersive-status-bar-insets
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout patched branch
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build Chromium/Titanium
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ""
          STORE_TEST_JKS: ""
        run: |
          ./build.sh

      - name: Sign APKs with temporary test key
        if: always()
        run: |
          set -e
          APK_SIGNER=$(find "$GITHUB_WORKSPACE/chromium/src/third_party/android_sdk/public/build-tools" -name apksigner | sort -V | tail -n1)
          KEYTOOL=$(find "$GITHUB_WORKSPACE/chromium/src/third_party/jdk" -name keytool | sort | tail -n1)

          if [ -z "$APK_SIGNER" ] || [ -z "$KEYTOOL" ]; then
            echo "Required signing tools were not found."
            exit 1
          fi

          "$KEYTOOL" -genkeypair -v \
            -keystore "$RUNNER_TEMP/test.jks" \
            -storepass android -keypass android \
            -alias androidtest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Titanium Test,O=Titanium,C=US"

          mkdir -p "$GITHUB_WORKSPACE/test-release"

          for apk in "$GITHUB_WORKSPACE"/chromium/src/out/tmp/*-arm64-v8a.apk "$GITHUB_WORKSPACE"/chromium/src/out/tmp/*-armeabi-v7a.apk; do
            if [ -f "$apk" ]; then
              name=$(basename "$apk")
              "$APK_SIGNER" sign --ks "$RUNNER_TEMP/test.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias androidtest --in "$apk" --out "$GITHUB_WORKSPACE/test-release/$name"
            fi
          done

      - name: Upload patched APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanium-immersive-test-apks
          path: test-release/*.apk
          if-no-files-found: warn
          retention-days: 7
